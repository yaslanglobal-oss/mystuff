name: Secure Port Scanner (Push to Private Repo)

on:
  workflow_dispatch: # 支持手动点击测试
  schedule:
    - cron: '0 0 */7 * *' # 每 7 天自动运行一次

jobs:
  secure_scan:
    runs-on: ubuntu-latest

    steps:
    # 1. 检出当前扫描仓库代码
    - name: Checkout code
      uses: actions/checkout@v5

    # 2. 安装 Nmap 工具
    - name: Install Nmap Tool
      run: |
        sudo apt-get update
        sudo apt-get install -y nmap

    # 3. 极速全端口嗅探
    - name: Run Full Port Nmap Scan (0-65535)
      env:
        MY_TARGET_IP: ${{ secrets.MY_SERVER }}
      run: |
        nmap -p- -T4 --min-rate 1500 $MY_TARGET_IP > nmap_report.txt

    # 4. 运行解析验证脚本，产出 report.json
    - name: Process & Generate JSON Report
      env:
        MY_USER: ${{ secrets.MY_USER }}
        MY_PASS: ${{ secrets.MY_PASS }}
        MY_TARGET_IP: ${{ secrets.MY_SERVER }}
      run: python ${{ github.workspace }}/send_nmap.py

    # 5. 🎯 终极原生防线：不依赖任何第三方组件，直接用纯 Git 命令跨仓库安全提交
    - name: Push Report to Private Repo (Pure Git)
      env:
        # 安全读取你设置好的私人钥匙
        SECRET_PAT: ${{ secrets.MY_PAT }}
      run: |
        # 配置虚拟虚拟环境的提交者身份
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"
        
        # 1. 在虚拟机创建一个独立的临时缓存文件夹，用来拉取私密仓库
        mkdir -p /tmp/sync_repo
        
        # 2. 核心：使用隐藏 Token 鉴权的绝对私密链接克隆你的 mypr0xy 仓库
        # 💡 这里的 yaslanglobal-oss 和 mypr0xy 已经根据你的真实日志配置锁死
        git clone https://${SECRET_PAT}@://github.com /tmp/sync_repo
        
        # 3. 将刚才第四步完美生成的结果文件拷贝进该私密仓库中
        cp report.json /tmp/sync_repo/
        
        # 4. 切换进私密仓库文件夹执行标准的本地提交
        cd /tmp/sync_repo
        git add report.json
        
        # 5. 检查文件是否有实质性内容更新，如果有变化则直接进行安全推流
        if git diff-index --quiet HEAD --; then
          echo "📊 本次扫描结果与上周完全一致，无需重复提交数据。"
        else
          git commit -m "自动同步：定时全端口审查报告更新 (${{ github.run_number }})"
          git push origin main
          echo "🎉 恭喜！最新的 report.json 数据已成功送入你的私密保险箱！"
        fi
