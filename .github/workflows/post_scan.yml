name: Auto Server Port Scanner (Nmap)

on:
  workflow_dispatch: # 支持手动点击测试
  schedule:
    - cron: '0 0 */7 * *' # 每 7 天运行一次

jobs:
  nmap_scan:
    runs-on: ubuntu-latest

    steps:
    # 1. 检出代码
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. 在 GitHub 虚拟机中安装真正的 Nmap 工具
    - name: Install Nmap Tool
      run: |
        sudo apt-get update
        sudo apt-get install -y nmap

    # 3. 运行 Nmap 扫描（请把下面的 12.34.56.78 换成你网页工具扫的那个真实目标 IP）
    # -p- 代表全量扫描 0-65535 的所有端口。如果不加 -p- 默认只扫最常用的 1000 个端口。
    - name: Run Nmap Scan
      run: |
        echo "正在对目标主机执行全端口扫描，请稍候..."
        nmap -p- 42.194.173.209 > nmap_report.txt

    # 4. 运行 Python 脚本把 nmap_report.txt 里面的内容私发给你的 TG
    - name: Push Report to Telegram
      env:
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: python send_nmap.py
