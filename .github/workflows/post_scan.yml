name: Auto Server Port Scanner (Nmap Fast & Full)

on:
  workflow_dispatch: # 支持手动点击测试
  schedule:
    - cron: '0 0 */7 * *' # 每 7 天运行一次

jobs:
  nmap_scan:
    runs-on: ubuntu-latest

    steps:
    # 1. 检出代码
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. 安装本地 Nmap 工具
    - name: Install Nmap Tool
      run: |
        sudo apt-get update
        sudo apt-get install -y nmap

    # 3. 🛑 【第一阶段】极速扫描常用 Top 1000 端口（耗时约 10 秒左右）
    # 请把 12.34.56.78 换成你的真实目标 IP
    - name: Run Stage 1 - Fast Scan (Top 1000)
      run: |
        echo "🚀 启动第一阶段：常用端口快速扫描..."
        nmap 42.194.173.209 > nmap_report.txt

    # 4. 📱 立刻发送第一阶段报告到 TG（让你秒知运行状态）
    - name: Push Stage 1 Report
      env:
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: python send_nmap.py stage1

    # 5. ⏳ 【第二阶段】深度扫描其余所有高位端口（1001 - 65535，耗时约几分钟）
    # 请把 12.34.56.78 换成你的真实目标 IP
    - name: Run Stage 2 - Full Scan (1001-65535)
      run: |
        echo "⏳ 启动第二阶段：全量高位端口深度扫描（此步骤耗时较长，请耐心等待）..."
        nmap -p 1001-65535 42.194.173.209 > nmap_report.txt

    # 6. 📱 发送第二阶段（最终阶段）报告到 TG
    - name: Push Stage 2 Report
      env:
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: python send_nmap.py stage2
